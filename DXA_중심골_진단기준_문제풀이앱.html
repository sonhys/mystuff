<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DXA 중심골 진단 기준 문제풀이</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#657084;--primary:#3157d5;--line:#dce3ef}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:#fffffff2;border-bottom:1px solid var(--line);padding:16px}.wrap{max-width:900px;margin:auto}
h1{font-size:1.3rem;margin:0 0 10px}.stats{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.92rem}
.progress{height:8px;background:#e7ebf3;border-radius:99px;margin-top:10px;overflow:hidden}#bar{height:100%;width:0;background:var(--primary);transition:.25s}
main{padding:20px 14px 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px #1e325a0d}
.q{font-weight:750;line-height:1.55;margin-bottom:14px}.num{color:var(--primary);margin-right:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;line-height:1.45}
.opt:hover{background:#f7f9ff}.opt input{margin-top:4px;transform:scale(1.2)}.correct{border-color:#4aa879;background:#eefaf4}.wrong{border-color:#d86c73;background:#fff1f2}
.feedback{display:none;margin-top:14px;padding:14px;border-radius:10px;line-height:1.55}.ok{display:block;background:#eaf8f1;color:#105d3a}.bad{display:block;background:#fff0f1;color:#94212a}
.actions{text-align:center;margin-top:24px}button{border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}#finish{background:var(--primary);color:white}#reset{background:#e8ecf5;margin-left:8px}
#result{display:none;background:white;border:2px solid var(--primary);border-radius:16px;padding:24px;text-align:center;margin:20px 0}#result strong{font-size:2rem;color:var(--primary)}.note{font-size:.86rem;color:var(--muted)}
@media(max-width:600px){.card{padding:16px}h1{font-size:1.1rem}}
</style></head><body>
<header><div class="wrap"><h1>DXA 중심골 진단 기준 — 15문항</h1>
<div class="stats"><span id="answered">응답 0/15</span><span id="correct">정답 0</span><span id="remaining">미응답 15</span></div>
<div class="progress"><div id="bar"></div></div></div></header>
<main class="wrap"><div id="quiz"></div><div class="actions"><button id="finish">총점 확인</button><button id="reset">다시 풀기</button></div><div id="result"></div>
<p class="note">각 문항은 처음 선택한 답으로 즉시 채점됩니다.</p></main>
<script>
const questions=[{"q": "DXA 중심골 골밀도 측정 시 대퇴골 부위에서 단독 측정값으로 공식 진단에 사용할 수 없는 부위는?", "o": ["대퇴골 경부(Femur neck)", "대퇴골 전체(Total hip)", "워드 삼각(Ward's triangle)", "대퇴골 원위부(Distal femur)"], "a": 3, "e": "대퇴골 골밀도는 대퇴골 경부와 전체 대퇴골 중 낮은 값을 기준으로 진단합니다. Ward's triangle과 전자부의 단독값은 정밀도가 낮고 과잉진단 위험이 있어 진단에 사용하지 않습니다."}, {"q": "요추 골밀도 평가를 위한 평균 T-score 산정 시 원칙적으로 포함해야 하는 범위는?", "o": ["L1~L3", "L1~L4", "L1~L5", "L2~L4"], "a": 2, "e": "요추 골밀도는 L1~L4 네 개 부위의 평균 T-score로 평가하는 것이 원칙입니다. 명확한 배제 사유가 없는 요추는 임의로 제외해서는 안 됩니다."}, {"q": "요추 골밀도 측정 시 L5를 평균 T-score 산정에서 제외하는 주된 이유는?", "o": ["골절이 거의 일어나지 않기 때문", "다른 요추보다 크고 골밀도가 높게 측정되며 자세에 따른 편차가 크기 때문", "연부조직 보정이 불가능하기 때문", "측면 촬영으로만 관찰되기 때문"], "a": 2, "e": "L5는 다른 요추보다 크고 골밀도가 상대적으로 높게 측정되며, 자세에 따른 측정 편차도 커서 평균값 산정에서 제외합니다."}, {"q": "특정 요추 분절을 평균값 산정에서 배제할 수 있는 명확한 사유가 아닌 것은?", "o": ["압박골절이 확인된 경우", "심한 퇴행성 변화가 있는 경우", "인접 요추와 T-score 차이가 0.5인 경우", "금속 보형물 등 구조적 변화가 있는 경우"], "a": 3, "e": "골절, 심한 퇴행성 변화, 보형물 등 구조적 변화, 인접 요추와 T-score 차이가 1.0 이상인 경우가 배제 사유입니다. 차이 0.5는 배제 사유가 아닙니다."}, {"q": "배제 사유가 있는 부위를 제외한 뒤 요추 골밀도로 판정하려면 최소 몇 부위가 남아야 합니까?", "o": ["1부위", "2부위", "3부위", "4부위"], "a": 2, "e": "평가 가능한 요추가 최소 2부위 이상 남아야 평균값으로 판정할 수 있습니다. 1개 부위만 남으면 요추 골밀도를 공식 판정에 사용할 수 없습니다."}, {"q": "평가에 적합한 요추가 1개 부위만 남았을 때의 올바른 진단 원칙은?", "o": ["남은 1개 요추의 T-score로 진단한다", "남은 요추와 T12를 평균낸다", "요추 결과는 사용하지 않고 대퇴골 등 다른 유효 부위로 진단한다", "검사를 무효 처리하고 6개월 후 재검한다"], "a": 3, "e": "평가 가능한 요추가 1개만 남으면 요추 골밀도 결과는 판정에 사용할 수 없습니다. 대퇴골 등 다른 유효한 골격 부위를 기준으로 진단합니다."}, {"q": "DXA 대퇴골 골밀도 진단 시 기준으로 삼는 부위 조합은?", "o": ["대퇴골 경부와 전체 대퇴골 중 낮은 부위", "대퇴골 경부와 Ward's triangle 중 낮은 부위", "전체 대퇴골과 전자부 중 낮은 부위", "대퇴골 경부와 전자부 중 높은 부위"], "a": 1, "e": "대퇴골 골밀도는 대퇴골 경부와 전체 대퇴골의 T-score 중 더 낮은 값을 기준으로 평가합니다."}, {"q": "60대 이상에서 요추 골밀도가 실제보다 높게 측정되는 가장 흔한 원인은?", "o": ["활동성 결핵", "요추의 퇴행성 변화", "골수 저세포성 변화", "만성 저나트륨혈증"], "a": 2, "e": "고령층에서는 골극 등 요추 퇴행성 변화와 대동맥 석회화 때문에 골밀도가 실제보다 높게 측정될 수 있습니다."}, {"q": "요추 골밀도 검사 시 촬영 방법의 원칙으로 옳은 것은?", "o": ["측면 촬영을 우선 사용한다", "PA view가 원칙이며 측면 촬영은 진단용으로 인정되지 않는다", "사선 촬영을 기준으로 한다", "가장 낮은 T-score가 나온 방향을 선택한다"], "a": 2, "e": "요추 골밀도 진단은 PA view를 기반으로 합니다. 측면 촬영은 공식 진단용으로 인정되지 않고 보조적으로만 활용됩니다."}, {"q": "예외적으로 요골 등 말단골 골밀도로 공식 진단할 수 있는 상황이 아닌 것은?", "o": ["검사 전 공복을 유지하지 않은 경우", "양측 대퇴골 인공관절과 척추 금속 고정으로 중심골 측정이 불가능한 경우", "부갑상선기능항진증 환자인 경우", "고도 비만으로 검사대 체중 제한을 초과한 경우"], "a": 1, "e": "공복 여부는 DXA 검사의 제한 사유가 아닙니다. 중심골 측정이 불가능하거나 부갑상선기능항진증처럼 요골 측정이 중요한 경우에 말단골 측정을 사용할 수 있습니다."}, {"q": "말단골 골밀도를 공식 진단에 사용할 때 인정되는 측정 기법과 부위는?", "o": ["QUS로 측정한 종골", "QCT로 측정한 손가락뼈", "DXA로 측정한 요골 1/3 부위", "단순 X-ray로 측정한 요골 전체"], "a": 3, "e": "공식 진단 및 급여 적용을 위한 말단골 측정은 DXA로 측정한 요골 1/3 부위의 T-score를 사용합니다."}, {"q": "QCT로 골다공증 치료제 급여 개시 기준을 충족하는 수치는?", "o": ["50 mg/cm³ 이하", "80 mg/cm³ 이하", "100 mg/cm³ 이하", "120 mg/cm³ 이하"], "a": 2, "e": "QCT 골밀도가 80 mg/cm³ 이하일 때 골다공증 치료제 급여 개시 기준을 충족합니다."}, {"q": "종골 초음파(QUS) 골밀도 결과에 대한 급여 심사 원칙으로 옳은 것은?", "o": ["T-score -2.5 이하이면 중심골 검사 없이 급여 개시 가능", "공식 진단 및 급여 기준으로 인정되지 않고 선별에만 활용", "QCT와 동일하게 80 mg/cm³ 기준 적용", "50세 이상 남성에게만 공식 진단으로 인정"], "a": 2, "e": "종골 초음파는 위험 선별에 활용할 수 있으나 골다공증 치료제 급여 개시를 위한 공식 진단 결과로는 인정되지 않습니다."}, {"q": "급여 기준상 골다공증성 골절 인정 부위에 포함되지 않는 것은?", "o": ["대퇴골 및 척추", "요골 및 상완골", "골반골·천골·발목", "두개골 및 발가락"], "a": 4, "e": "인정 부위는 대퇴골, 척추, 요골, 상완골, 골반골, 천골 및 발목입니다. 두개골과 발가락은 포함되지 않습니다."}, {"q": "추적 골밀도를 이전 검사와 비교할 때 적용되는 원칙은?", "o": ["요추로 진단했더라도 대퇴골과 교차 비교", "최초 진단을 받은 동일 골격 부위끼리 비교", "가장 낮은 T-score 부위를 무작위 선택", "정상으로 개선되면 요골 1/3과 소급 비교"], "a": 2, "e": "치료 지속 여부는 최초 진단을 받은 동일 부위끼리 비교해야 합니다. 요추는 요추와, 대퇴골은 대퇴골과 비교하며 교차 비교는 인정되지 않습니다."}];let answered=0,score=0;const quiz=document.getElementById('quiz');
function render(){quiz.innerHTML='';questions.forEach((x,qi)=>{const c=document.createElement('section');c.className='card';c.dataset.done='0';
c.innerHTML=`<div class="q"><span class="num">${qi+1}.</span>${x.q}</div><div>${x.o.map((v,i)=>`<label class="opt"><input type="checkbox" data-i="${i+1}"><span>${i+1}. ${v}</span></label>`).join('')}</div><div class="feedback"></div>`;
c.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>grade(c,qi,+inp.dataset.i)));quiz.appendChild(c);});update();}
function grade(c,qi,ch){if(c.dataset.done==='1')return;c.dataset.done='1';answered++;const x=questions[qi],good=ch===x.a;if(good)score++;
[...c.querySelectorAll('.opt')].forEach((lab,i)=>{lab.querySelector('input').disabled=true;if(i+1===x.a)lab.classList.add('correct');if(i+1===ch&&!good)lab.classList.add('wrong');});
const f=c.querySelector('.feedback');f.className='feedback '+(good?'ok':'bad');f.innerHTML=good?`<strong>정답</strong><br>${x.e}`:`<strong>오답</strong> — 정답은 <b>${x.a}번</b>입니다.<br>${x.e}`;update();}
function update(){answeredEl.textContent=`응답 ${answered}/${questions.length}`;correctEl.textContent=`정답 ${score}`;remainingEl.textContent=`미응답 ${questions.length-answered}`;bar.style.width=(answered/questions.length*100)+'%';}
const answeredEl=document.getElementById('answered'),correctEl=document.getElementById('correct'),remainingEl=document.getElementById('remaining'),bar=document.getElementById('bar');
finish.onclick=()=>{const r=document.getElementById('result'),pct=Math.round(score/questions.length*100);r.style.display='block';r.innerHTML=`<div>총점</div><strong>${score} / ${questions.length}</strong><div>${pct}점</div><div class="note">미응답 ${questions.length-answered}문항</div>`;r.scrollIntoView({behavior:'smooth'});};
reset.onclick=()=>{if(confirm('모든 답과 점수를 초기화할까요?')){answered=0;score=0;result.style.display='none';render();scrollTo({top:0,behavior:'smooth'});}};render();
</script></body></html>
