<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DaysToGo">
<meta name="theme-color" content="#ffffff">
<title>DaysToGo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#ffffff;--bg2:#f5f5f7;--bg3:#ebebed;
    --text:#1d1d1f;--text2:#6e6e73;--text3:#aeaeb2;
    --border:#d2d2d7;--border2:#e0e0e5;
    --blue:#0071e3;--blue-bg:#e8f1fc;--blue-text:#004aad;
    --green:#1d7b45;--green-bg:#e6f4ed;--green-text:#14542f;
    --red:#c00;--red-bg:#fef0f0;--red-text:#900;
    --accent:#0071e3;
    --radius:12px;--radius-sm:8px;
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  @media(prefers-color-scheme:dark){
    :root{
      --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
      --text:#f5f5f7;--text2:#aeaeb2;--text3:#6e6e73;
      --border:#3a3a3c;--border2:#2c2c2e;
      --blue:#409cff;--blue-bg:#1a2d4a;--blue-text:#70b8ff;
      --green:#4cd964;--green-bg:#1a3328;--green-text:#6ddf8c;
      --red:#ff6b6b;--red-bg:#3a1f1f;--red-text:#ff9999;
      --accent:#409cff;
    }
  }
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;font-size:16px}
  body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}

  /* Header */
  .header{
    padding:52px 20px 0;
    display:flex;align-items:center;justify-content:space-between;
    flex-shrink:0;
  }
  .app-name{font-size:34px;font-weight:700;letter-spacing:-.5px;color:var(--text)}
  .hdr-btn{width:34px;height:34px;border-radius:50%;border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s}
  .hdr-btn.add{background:var(--blue)}
  .hdr-btn.add svg{stroke:#fff}
  .hdr-btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* Bottom tab bar */
  .tab-bar{display:flex;align-items:center;padding:0 8px;flex-shrink:0;
    border-bottom:1px solid var(--border2);margin-top:16px}
  .tab-bar-tabs{display:flex;flex:1}
  .tab{padding:10px 16px 10px 4px;font-size:15px;font-weight:500;color:var(--text2);cursor:pointer;
    border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab-bar-actions{display:flex;gap:2px;align-items:center;padding-bottom:4px}
  .io-btn{width:36px;height:36px;border-radius:var(--radius-sm);background:none;border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;flex-shrink:0}
  .io-btn:active{background:var(--bg3)}
  .io-btn svg{width:17px;height:17px;fill:none;stroke:var(--text2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .io-label{font-size:10px;color:var(--text3);text-align:center;margin-top:-2px;line-height:1}

  /* Scroll area */
  .panels{flex:1;overflow:hidden;position:relative}
  .panel{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 16px calc(20px + var(--safe-bottom));display:none}
  .panel.active{display:block}

  /* Event card */
  .ev-card{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:background .12s;position:relative;overflow:hidden}
  .ev-card:active{background:var(--bg2)}
  .ev-card-inner{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ev-info{flex:1;min-width:0}
  .ev-title{font-size:16px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev-date{font-size:13px;color:var(--text2);margin-top:3px}
  .ev-note{font-size:13px;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ev-count{text-align:right;flex-shrink:0}
  .ev-d{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.5px}
  .ev-dlabel{font-size:11px;color:var(--text2);margin-top:2px}
  .ev-repeat-badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:20px;
    background:var(--blue-bg);color:var(--blue-text);font-weight:500;margin-top:4px}
  .card-upcoming .ev-d{color:var(--blue)}
  .card-past .ev-d{color:var(--green)}
  .card-today .ev-d{color:var(--red)}
  .card-today{border-color:var(--red);background:var(--red-bg)}

  /* Progress bar on card */
  .ev-bar{height:3px;border-radius:2px;background:var(--bg3);margin-top:10px;overflow:hidden}
  .ev-bar-fill{height:100%;border-radius:2px;background:var(--blue);transition:width .3s}
  .card-past .ev-bar-fill{background:var(--green)}

  /* Empty state */
  .empty{text-align:center;padding:48px 24px;color:var(--text2)}
  .empty-icon{font-size:42px;margin-bottom:12px;opacity:.35}
  .empty-text{font-size:15px;line-height:1.5}

  /* FAB */
  .fab{position:fixed;bottom:calc(24px + var(--safe-bottom));right:20px;
    width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 4px 16px rgba(0,113,227,.35);z-index:50}
  .fab svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}

  /* Bottom sheet modal */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
    opacity:0;transition:opacity .25s;pointer-events:none}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
    width:100%;max-width:480px;background:var(--bg);
    border-radius:20px 20px 0 0;z-index:201;
    transition:transform .3s cubic-bezier(.32,0,.15,1);
    max-height:92vh;display:flex;flex-direction:column}
  .sheet.open{transform:translateX(-50%) translateY(0)}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0;flex-shrink:0}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 4px;flex-shrink:0}
  .sheet-title{font-size:17px;font-weight:600;color:var(--text)}
  .sheet-close{width:28px;height:28px;border-radius:50%;background:var(--bg3);border:none;
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  .sheet-close svg{width:14px;height:14px;fill:none;stroke:var(--text2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:8px 20px calc(16px + var(--safe-bottom));flex:1}

  /* Form */
  .form-group{margin-bottom:14px}
  .form-label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}
  .form-input{width:100%;padding:11px 14px;background:var(--bg2);border:1px solid var(--border2);
    border-radius:var(--radius-sm);font-size:15px;color:var(--text);outline:none;
    transition:border-color .15s;-webkit-appearance:none;appearance:none;font-family:inherit}
  .form-input:focus{border-color:var(--accent)}
  .form-input::placeholder{color:var(--text3)}
  textarea.form-input{resize:none;line-height:1.6}

  /* Date trigger */
  .date-field{width:100%;padding:11px 14px;background:var(--bg2);border:1px solid var(--border2);
    border-radius:var(--radius-sm);font-size:15px;color:var(--text);cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;-webkit-appearance:none;
    border:none;text-align:left;font-family:inherit}
  .date-field.placeholder{color:var(--text3)}
  .date-field-wrap{border:1px solid var(--border2);border-radius:var(--radius-sm);overflow:hidden;background:var(--bg2)}
  .date-field-wrap:focus-within{border-color:var(--accent)}

  /* Repeat selector */
  .repeat-field{width:100%;padding:11px 14px;background:var(--bg2);
    border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:15px;color:var(--text);
    cursor:pointer;display:flex;align-items:center;justify-content:space-between;
    border:none;text-align:left;font-family:inherit}
  .repeat-wrap{border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg2);overflow:hidden}
  .repeat-opts{border-top:1px solid var(--border2);display:none}
  .repeat-opts.open{display:block}
  .repeat-opt{padding:11px 14px;font-size:15px;color:var(--text);cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border2)}
  .repeat-opt:first-child{border-top:none}
  .repeat-opt:active{background:var(--bg3)}
  .repeat-opt.sel{color:var(--accent);font-weight:500}
  .chk{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
  .repeat-opt.sel .chk{visibility:visible}
  .chev{width:16px;height:16px;fill:none;stroke:var(--text2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;flex-shrink:0}
  .chev.up{transform:rotate(180deg)}

  /* Calendar */
  .cal-wrap{border-top:1px solid var(--border2);display:none;padding:12px}
  .cal-wrap.open{display:block}
  .cal-nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-month{font-size:15px;font-weight:600;color:var(--text)}
  .cal-month:active{background:var(--bg3) !important}
  .cal-month svg{width:13px;height:13px;fill:none;stroke:var(--text2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* Year picker */
  .year-picker{display:none}
  .year-picker.open{display:block}
  .year-picker.open ~ .cal-grid, .cal-grid.hidden-by-year{display:none}
  .year-picker-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .year-decade-label{font-size:15px;font-weight:600;color:var(--text)}
  .year-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .year-cell{font-size:14px;padding:10px 2px;text-align:center;cursor:pointer;border-radius:var(--radius-sm);
    color:var(--text);transition:background .1s}
  .year-cell:active{background:var(--bg3)}
  .year-cell.cur-year{color:var(--accent);font-weight:700}
  .year-cell.sel-year{background:var(--accent);color:#fff !important;font-weight:600}
  .year-cell.out-range{color:var(--text3)}
  .cal-btn{width:32px;height:32px;border-radius:50%;background:var(--bg3);border:none;
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  .cal-btn svg{width:14px;height:14px;fill:none;stroke:var(--text);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .cal-dow{font-size:11px;color:var(--text2);padding:4px 0;font-weight:600}
  .cal-day{font-size:13px;padding:7px 2px;cursor:pointer;border-radius:50%;color:var(--text);
    line-height:1;display:flex;align-items:center;justify-content:center;aspect-ratio:1;transition:background .1s}
  .cal-day:active{background:var(--bg3)}
  .cal-day.today{color:var(--accent);font-weight:700}
  .cal-day.sel{background:var(--accent);color:#fff !important;font-weight:600}
  .cal-day.empty{cursor:default;pointer-events:none}

  /* Action buttons */
  .btn-save{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;
    border-radius:var(--radius-sm);font-size:16px;font-weight:600;cursor:pointer;margin-top:6px;font-family:inherit}
  .btn-save:active{opacity:.85}
  .btn-delete{width:100%;padding:12px;background:none;border:1px solid var(--border);
    border-radius:var(--radius-sm);font-size:15px;color:var(--red);cursor:pointer;margin-top:8px;font-family:inherit}
  .btn-delete:active{background:var(--red-bg)}

  /* Section title */
  .section-title{font-size:13px;font-weight:600;color:var(--text2);padding:6px 4px 8px;letter-spacing:.2px}
  
  /* Section header */
  .sec-header{font-size:13px;font-weight:500;color:var(--text2);
    background:var(--bg2);padding:6px 16px;margin:0 -16px;
    border-top:1px solid var(--border2);border-bottom:1px solid var(--border2);
    letter-spacing:.1px}
  .sec-header:first-child{border-top:none;margin-top:0}
  .panel.active{padding-top:0}

  /* List row (upcoming) */
  .ev-row{display:flex;align-items:center;justify-content:space-between;
    padding:13px 4px;border-bottom:1px solid var(--border2);cursor:pointer;gap:12px;transition:background .1s}
  .ev-row:last-child{border-bottom:none}
  .ev-row:active{background:var(--bg2)}
  .ev-row.row-today{background:var(--red-bg)}
  .ev-row-info{flex:1;min-width:0}
  .ev-row-title{font-size:16px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ev-row-date{font-size:13px;color:var(--text2);margin-top:2px}
  .row-next-label{font-size:11px;color:var(--blue);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .ev-row-d{font-size:32px;font-weight:300;color:var(--text2);flex-shrink:0;letter-spacing:-1px;min-width:44px;text-align:right;line-height:1}
  .ev-row-d.d-today{font-size:18px;font-weight:600;color:var(--red)}

  /* Past box */
  .past-box-wrap{display:flex;flex-direction:column;align-items:center;padding:28px 0 12px}
  .past-box-icon{width:80px;height:80px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
  .past-box-icon svg{width:64px;height:64px}
  .past-box-label{font-size:13px;color:var(--text2);margin-top:8px;font-weight:500}
  .past-list{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden}
  .past-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;
    cursor:pointer;border-bottom:1px solid var(--border2);transition:background .1s;gap:8px}
  .past-row:last-child{border-bottom:none}
  .past-row:active{background:var(--bg2)}
  .past-row-info{flex:1;min-width:0}
  .past-row-title{font-size:15px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .past-row-date{font-size:12px;color:var(--text2);margin-top:2px}
  .past-row-d{font-size:17px;font-weight:700;color:var(--green);flex-shrink:0;letter-spacing:-.3px}

  @media(prefers-reduced-motion:reduce){.sheet,.sheet-bg{transition:none}}
</style>
</head>
<body>

<div class="header">
  <span class="app-name">DaysToGo</span>
  <button class="hdr-btn add" onclick="openSheet(-1)" title="이벤트 추가">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
</div>

<div class="tab-bar">
  <div class="tab-bar-tabs">
    <div class="tab active" data-tab="upcoming" onclick="switchTab('upcoming')" style="display:flex;align-items:center;gap:5px;padding-left:4px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="flex-shrink:0">
        <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/>
        <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="8" cy="15" r="1.2" fill="currentColor"/>
        <circle cx="12" cy="15" r="1.2" fill="currentColor"/>
        <circle cx="16" cy="15" r="1.2" fill="currentColor"/>
      </svg>
    </div>
    <div class="tab" data-tab="past" onclick="switchTab('past')" style="display:flex;align-items:center;gap:5px;padding-left:4px">
      <svg width="22" height="18" viewBox="0 0 22 18" fill="none" style="flex-shrink:0">
        <rect x="1" y="7" width="20" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
        <rect x="1" y="7" width="20" height="3.5" rx="1" fill="currentColor" opacity=".13"/>
        <path d="M2 7L4.5 1h13L20 7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <line x1="8.5" y1="13" x2="13.5" y2="13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <button class="io-btn" onclick="event.stopPropagation();importData()" title="가져오기">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="io-btn" onclick="event.stopPropagation();exportData()" title="내보내기">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- hidden file input for import -->
<input type="file" id="import-input" accept=".json" style="display:none" onchange="handleImport(event)">

<div class="panels">
  <div class="panel active" id="panel-upcoming"></div>
  <div class="panel" id="panel-past"></div>
</div>





<div class="sheet-bg" id="sheet-bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title" id="sheet-title">새 이벤트</span>
    <button class="sheet-close" onclick="closeSheet()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sheet-body">

    <div class="form-group">
      <label class="form-label" for="f-title">Title</label>
      <input class="form-input" type="text" id="f-title" placeholder="이벤트 이름" autocomplete="off">
    </div>

    <div class="form-group">
      <label class="form-label">Date</label>
      <div class="date-field-wrap">
        <button class="date-field placeholder" id="date-trigger" type="button" onclick="toggleCal()">
          <span id="date-display">날짜를 선택하세요</span>
          <svg style="width:16px;height:16px;fill:none;stroke:var(--text2);stroke-width:1.8;stroke-linecap:round" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </button>
        <div class="cal-wrap" id="cal-wrap">
          <div class="cal-nav-row">
            <button class="cal-btn" onclick="calNav(-1)" type="button">
              <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button class="cal-month" id="cal-month" type="button" onclick="toggleYearPicker()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:6px"></button>
            <button class="cal-btn" onclick="calNav(1)" type="button">
              <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
          <div class="year-picker" id="year-picker">
            <div class="year-picker-nav">
              <button class="cal-btn" onclick="yearDecadeNav(-1)" type="button">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <span class="year-decade-label" id="year-decade-label"></span>
              <button class="cal-btn" onclick="yearDecadeNav(1)" type="button">
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
            <div class="year-grid" id="year-grid"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Repeat</label>
      <div class="repeat-wrap">
        <button class="repeat-field" type="button" onclick="toggleRepeat()">
          <span id="repeat-display">Never</span>
          <svg class="chev" id="repeat-chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="repeat-opts" id="repeat-opts">
          <div class="repeat-opt sel" data-val="Never" onclick="pickRepeat(this)">
            Never
            <svg class="chk" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="repeat-opt" data-val="Weekly" onclick="pickRepeat(this)">
            Weekly
            <svg class="chk" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="repeat-opt" data-val="Monthly" onclick="pickRepeat(this)">
            Monthly
            <svg class="chk" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="repeat-opt" data-val="Yearly" onclick="pickRepeat(this)">
            Yearly
            <svg class="chk" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="f-note">Note</label>
      <textarea class="form-input" id="f-note" rows="3" placeholder="메모를 입력하세요"></textarea>
    </div>

    <button class="btn-save" type="button" onclick="saveEvent()">저장</button>
    <button class="btn-delete" type="button" id="btn-delete" onclick="deleteEvent()" style="display:none">이벤트 삭제</button>
  </div>
</div>

<script>
const MONTHS_KO=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const MONTHS_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun.','Mon.','Tue.','Wed.','Thu.','Fri.','Sat.'];
const DOW_SHORT=['Su','Mo','Tu','We','Th','Fr','Sa'];

let events = JSON.parse(localStorage.getItem('days_v1') || '[]');
let editIdx = -1;
let selDate = null;
let calY, calM;
let repeatVal = 'Never';
let currentTab = 'upcoming';

function save(){ localStorage.setItem('days_v1', JSON.stringify(events)); }

function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }

function diffDays(iso){
  const t = new Date(iso+'T00:00:00'); t.setHours(0,0,0,0);
  return Math.round((t - today()) / 86400000);
}

function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}, ${DOW[d.getDay()]}`;
}

function isoToday(){
  const d = today();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function barPct(ev){
  if(!ev.created) return 0;
  const start = new Date(ev.created+'T00:00:00'); start.setHours(0,0,0,0);
  const end = new Date(ev.date+'T00:00:00'); end.setHours(0,0,0,0);
  const total = (end - start) / 86400000;
  if(total <= 0) return 100;
  const elapsed = (today() - start) / 86400000;
  return Math.min(100, Math.max(0, Math.round((elapsed / total) * 100)));
}

// ── Repeat: next occurrence after today ──────────────────────────────
function nextOccurrence(ev){
  if(!ev.repeat || ev.repeat==='Never') return ev.date;
  const base = new Date(ev.date+'T00:00:00'); base.setHours(0,0,0,0);
  const td = today();
  if(base >= td) return ev.date; // not past yet
  let d = new Date(base);
  while(d < td){
    if(ev.repeat==='Weekly')  d.setDate(d.getDate()+7);
    else if(ev.repeat==='Monthly') d.setMonth(d.getMonth()+1);
    else if(ev.repeat==='Yearly')  d.setFullYear(d.getFullYear()+1);
    else break;
  }
  return toISO(d);
}
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

// ── Section label ─────────────────────────────────────────────────────
function sectionOf(d){
  if(d===0) return 'Today';
  if(d<=7)  return 'Within a week';
  const td=today();
  const endOfMonth=new Date(td.getFullYear(),td.getMonth()+1,0); endOfMonth.setHours(0,0,0,0);
  const daysToEOM=Math.round((endOfMonth-td)/86400000);
  if(d<=daysToEOM) return 'Later this month';
  const nextMonthEnd=new Date(td.getFullYear(),td.getMonth()+2,0); nextMonthEnd.setHours(0,0,0,0);
  const daysToNME=Math.round((nextMonthEnd-td)/86400000);
  if(d<=daysToNME) return 'Next month';
  const endOfYear=new Date(td.getFullYear(),11,31); endOfYear.setHours(0,0,0,0);
  const daysToEOY=Math.round((endOfYear-td)/86400000);
  if(d<=daysToEOY) return 'Later this year';
  return 'Next year';
}

function renderAll(){
  // ── Upcoming: use nextOccurrence for repeat events ──
  const upRaw = events.map((e,i)=>{
    const effDate = nextOccurrence(e);
    const d = diffDays(effDate);
    return {...e, _i:i, _effDate:effDate, _d:d};
  }).filter(e=>e._d>=0).sort((a,b)=>a._d-b._d);

  // ── Past: repeat 이벤트도 원래 날짜 기준으로 포함 ──
  const paRaw = events.map((e,i)=>{
    const d = diffDays(e.date);
    return {...e, _i:i, _d:d};
  }).filter(e=>e._d<0).sort((a,b)=>b._d-a._d);

  // ── Render upcoming with section headers ──
  if(!upRaw.length){
    document.getElementById('panel-upcoming').innerHTML =
      `<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">예정된 이벤트가 없습니다<br>+ 버튼으로 추가하세요</div></div>`;
  } else {
    let html='', lastSec='';
    upRaw.forEach(e=>{
      const sec = sectionOf(e._d);
      if(sec!==lastSec){
        html+=`<div class="sec-header">${sec}</div>`;
        lastSec=sec;
      }
      html+=rowHTML(e);
    });
    document.getElementById('panel-upcoming').innerHTML=html;
  }

  document.getElementById('panel-past').innerHTML = paRaw.length
    ? paRaw.map(e=>cardHTML(e)).join('')
    : `<div class="empty"><div class="empty-icon">📦</div><div class="empty-text">지나간 이벤트가 없습니다</div></div>`;
}

// ── List row for upcoming (like the reference app) ────────────────────
function rowHTML(e){
  const d = e._d;
  const dLabel = d===0?'오늘':`${d}`;
  const repBadge = e.repeat && e.repeat!=='Never'
    ? `<span class="ev-repeat-badge">${e.repeat}</span>`:'';
  const displayDate = e._effDate !== e.date
    ? `<span class="row-next-label">next: </span>${fmtDate(e._effDate)}`
    : fmtDate(e._effDate);
  return `<div class="ev-row ${d===0?'row-today':''}" onclick="openSheet(${e._i})">
    <div class="ev-row-info">
      <div class="ev-row-title">${escHtml(e.title)}${repBadge}</div>
      <div class="ev-row-date">${displayDate}</div>
    </div>
    <div class="ev-row-d ${d===0?'d-today':''}">${dLabel}</div>
  </div>`;
}

function elapsedYMD(fromIso){
  const from = new Date(fromIso+'T00:00:00');
  const to = today();
  let y = to.getFullYear() - from.getFullYear();
  let m = to.getMonth() - from.getMonth();
  let d = to.getDate() - from.getDate();
  if(d<0){
    m--;
    const prevMonthLastDay = new Date(to.getFullYear(), to.getMonth(), 0).getDate();
    d += prevMonthLastDay;
  }
  if(m<0){ y--; m+=12; }
  const parts=[];
  if(y>0) parts.push(`${String(y).padStart(2,'0')}년`);
  if(m>0 || y>0) parts.push(`${String(m).padStart(2,'0')}월`);
  parts.push(`${String(d).padStart(2,'0')}일`);
  return parts.join(' ');
}

function cardHTML(e){
  const d = e._d;
  const cls = 'card-past';
  const dLabel = `${d}`;
  const subLabel = `${elapsedYMD(e.date)} 지남`;
  const repBadge = e.repeat && e.repeat!=='Never'
    ? `<div class="ev-repeat-badge">${e.repeat}</div>`:'';
  const notePart = e.note ? `<div class="ev-note">${escHtml(e.note)}</div>` : '';
  const barPart = `<div class="ev-bar"><div class="ev-bar-fill" style="width:100%;background:var(--green)"></div></div>`;
  return `<div class="ev-card ${cls}" onclick="openSheet(${e._i})">
    <div class="ev-card-inner">
      <div class="ev-info">
        <div class="ev-title">${escHtml(e.title)}</div>
        <div class="ev-date">${fmtDate(e.date)}</div>
        ${repBadge}
      </div>
      <div class="ev-count">
        <div class="ev-d">${dLabel}</div>
        <div class="ev-dlabel">${subLabel}</div>
      </div>
    </div>
    ${notePart}
    ${barPart}
  </div>`;
}

function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function switchTab(t){
  currentTab = t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active', el.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(el=>el.classList.remove('active'));
  document.getElementById('panel-'+t).classList.add('active');
}

// Sheet
function openSheet(idx){
  editIdx = idx;
  const ev = idx>=0 ? events[idx] : null;
  document.getElementById('sheet-title').textContent = ev ? '이벤트 수정' : '새 이벤트';
  document.getElementById('f-title').value = ev ? ev.title : '';
  document.getElementById('f-note').value = ev ? (ev.note||'') : '';
  repeatVal = ev ? (ev.repeat||'Never') : 'Never';
  document.getElementById('repeat-display').textContent = repeatVal;
  document.querySelectorAll('.repeat-opt').forEach(o=>{
    const isSel = o.dataset.val === repeatVal;
    o.classList.toggle('sel', isSel);
  });
  selDate = ev ? ev.date : null;
  const dtEl = document.getElementById('date-display');
  const trigEl = document.getElementById('date-trigger');
  if(selDate){ dtEl.textContent = fmtDate(selDate); trigEl.classList.remove('placeholder'); }
  else { dtEl.textContent = '날짜를 선택하세요'; trigEl.classList.add('placeholder'); }
  document.getElementById('btn-delete').style.display = ev ? 'block' : 'none';
  document.getElementById('cal-wrap').classList.remove('open');
  document.getElementById('repeat-opts').classList.remove('open');
  document.getElementById('repeat-chev').classList.remove('up');
  const init = selDate ? new Date(selDate+'T00:00:00') : new Date();
  calY = init.getFullYear(); calM = init.getMonth();
  renderCal();
  document.getElementById('sheet-bg').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(), 350);
}

function closeSheet(){
  document.getElementById('sheet-bg').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

function saveEvent(){
  const title = document.getElementById('f-title').value.trim();
  if(!title){ document.getElementById('f-title').focus(); shake('f-title'); return; }
  if(!selDate){ shake('date-trigger'); return; }
  const ev = { title, date: selDate, repeat: repeatVal, note: document.getElementById('f-note').value.trim(), created: isoToday() };
  if(editIdx>=0) events[editIdx]=ev; else events.push(ev);
  save(); closeSheet(); renderAll();
}

function deleteEvent(){
  if(editIdx>=0){ events.splice(editIdx,1); save(); closeSheet(); renderAll(); }
}

function shake(id){
  const el = document.getElementById(id);
  el.style.animation='none'; el.offsetHeight;
  el.style.animation='shake .4s ease';
}

// Calendar
function toggleCal(){
  const wrap = document.getElementById('cal-wrap');
  const isOpen = wrap.classList.toggle('open');
  if(isOpen) document.getElementById('repeat-opts').classList.remove('open');
}

function calNav(dir){
  calM += dir;
  if(calM>11){ calM=0; calY++; }
  if(calM<0){ calM=11; calY--; }
  renderCal();
}

function renderCal(){
  document.getElementById('cal-month').innerHTML = `${MONTHS_EN[calM]} ${calY} <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>`;
  document.getElementById('year-picker').classList.remove('open');
  document.getElementById('cal-grid').classList.remove('hidden-by-year');
  const grid = document.getElementById('cal-grid');
  let html = DOW_SHORT.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first = new Date(calY, calM, 1).getDay();
  const days = new Date(calY, calM+1, 0).getDate();
  const todayIso = isoToday();
  for(let i=0;i<first;i++) html+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=days;d++){
    const iso = `${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = iso===todayIso;
    const isSel = iso===selDate;
    html += `<div class="cal-day${isToday?' today':''}${isSel?' sel':''}" onclick="pickDate('${iso}')">${d}</div>`;
  }
  grid.innerHTML = html;
}

// Year picker
let decadeStart = null;
function toggleYearPicker(){
  const yp = document.getElementById('year-picker');
  const isOpen = yp.classList.toggle('open');
  document.getElementById('cal-grid').classList.toggle('hidden-by-year', isOpen);
  if(isOpen){
    decadeStart = calY - (calY % 12);
    renderYearGrid();
  }
}

function yearDecadeNav(dir){
  decadeStart += dir*12;
  renderYearGrid();
}

function renderYearGrid(){
  document.getElementById('year-decade-label').textContent = `${decadeStart} - ${decadeStart+11}`;
  const grid = document.getElementById('year-grid');
  const curYear = today().getFullYear();
  let html='';
  for(let y=decadeStart; y<decadeStart+12; y++){
    const cls = [];
    if(y===curYear) cls.push('cur-year');
    if(y===calY) cls.push('sel-year');
    html += `<div class="year-cell ${cls.join(' ')}" onclick="pickYear(${y})">${y}</div>`;
  }
  grid.innerHTML = html;
}

function pickYear(y){
  calY = y;
  document.getElementById('year-picker').classList.remove('open');
  document.getElementById('cal-grid').classList.remove('hidden-by-year');
  renderCal();
}

function pickDate(iso){
  selDate = iso;
  document.getElementById('date-display').textContent = fmtDate(iso);
  document.getElementById('date-trigger').classList.remove('placeholder');
  renderCal();
  setTimeout(()=>document.getElementById('cal-wrap').classList.remove('open'), 180);
}

// Repeat
function toggleRepeat(){
  const opts = document.getElementById('repeat-opts');
  const isOpen = opts.classList.toggle('open');
  document.getElementById('repeat-chev').classList.toggle('up', isOpen);
  if(isOpen) document.getElementById('cal-wrap').classList.remove('open');
}

function pickRepeat(el){
  repeatVal = el.dataset.val;
  document.getElementById('repeat-display').textContent = repeatVal;
  document.querySelectorAll('.repeat-opt').forEach(o=>o.classList.toggle('sel', o.dataset.val===repeatVal));
  document.getElementById('repeat-opts').classList.remove('open');
  document.getElementById('repeat-chev').classList.remove('up');
}

// Shake animation
const styleEl = document.createElement('style');
styleEl.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}';
document.head.appendChild(styleEl);

// ── Export / Import ───────────────────────────────────────────────────
function exportData(){
  if(!events.length){ alert('저장된 이벤트가 없습니다.'); return; }
  const payload = JSON.stringify({app:'Days',version:1,exported:new Date().toISOString(),events}, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = isoToday().replace(/-/g,'');
  a.href = url; a.download = `Days_backup_${dateStr}.json`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function importData(){
  document.getElementById('import-input').value = '';
  document.getElementById('import-input').click();
}

function handleImport(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      const incoming = parsed.events || (Array.isArray(parsed) ? parsed : null);
      if(!incoming || !Array.isArray(incoming)) throw new Error('형식 오류');
      if(events.length){
        if(!confirm(`현재 이벤트 ${events.length}개가 있습니다.\n[확인] 기존 데이터를 새 데이터로 교체\n[취소] 불러오기 취소`)) return;
      }
      events = incoming;
      save(); renderAll();
      alert(`✓ ${incoming.length}개 이벤트를 불러왔습니다.`);
    } catch(err){
      alert('파일을 읽을 수 없습니다.\nDays 백업 파일(.json)을 선택해 주세요.');
    }
  };
  reader.readAsText(file);
}

renderAll();
</script>
</body>
</html>
