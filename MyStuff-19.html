<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyStuff">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" id="pwa-manifest">
<link rel="apple-touch-icon" id="pwa-icon">
<title>MyStuff</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f5f7;--surface:#fff;--surface2:#f2f2f5;
  --text:#1a1a1a;--text2:#666;--text3:#aaa;
  --border:#e0e0e0;--border2:#c8c8c8;
  --accent:#1a1a1a;--accent-fg:#fff;
  --danger:#cc2222;
  --r:12px;--rsm:8px;--rpill:100px;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:0.5px solid var(--border);padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.topbar p{font-size:12px;color:var(--text2);margin-top:1px}
.icon-btn{background:none;border:none;cursor:pointer;width:36px;height:36px;border-radius:var(--rsm);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:20px}
.icon-btn:active{background:var(--surface2)}

/* TABS */
.tabs-wrap{background:rgba(255,255,255,0.93);backdrop-filter:blur(12px);border-bottom:0.5px solid var(--border);display:flex;align-items:center}
.tabs{display:flex;overflow-x:auto;flex:1;padding:0 8px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 13px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.tab-edit-btn{flex-shrink:0;padding:8px 10px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;display:flex;align-items:center}

/* CONTENT */
.content{padding:12px;max-width:480px;margin:0 auto}
.search-wrap{background:var(--surface2);border:0.5px solid var(--border);border-radius:var(--rpill);padding:10px 14px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.search-wrap input{background:none;border:none;outline:none;flex:1;font-size:14px;color:var(--text);font-family:inherit}
.search-wrap input::placeholder{color:var(--text3)}

/* ITEM LIST */
.item-list{display:flex;flex-direction:column;gap:8px}
.item-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:12px;display:flex;gap:12px;cursor:pointer;transition:transform .1s}
.item-card:active{transform:scale(0.985)}
.item-thumb{width:62px;height:62px;border-radius:var(--rsm);flex-shrink:0;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;position:relative}
.item-thumb img{width:100%;height:100%;object-fit:cover;border-radius:var(--rsm)}
.photo-badge{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,0.55);color:#fff;font-size:10px;padding:1px 5px;border-radius:100px;font-weight:500}
.item-info{flex:1;min-width:0}
.item-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{font-size:12px;color:var(--text2);margin-top:2px}
.item-chips{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 9px;border-radius:var(--rpill);background:var(--surface2);color:var(--text2);border:0.5px solid var(--border)}
.empty{text-align:center;padding:56px 24px;color:var(--text2)}
.empty-icon{font-size:52px;margin-bottom:12px}
.empty p{font-size:14px;line-height:1.7}

/* FAB */
.fab{position:fixed;bottom:28px;right:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-fg);border:none;cursor:pointer;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(0,0,0,0.22);z-index:50}
.fab:active{transform:scale(0.93)}

/* MODAL */
.backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto}
.sheet::-webkit-scrollbar{display:none}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}

/* FORM */
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block;font-weight:500}
.form-input,.form-select{width:100%;padding:11px 13px;border:0.5px solid var(--border2);border-radius:var(--rsm);font-size:14px;background:var(--surface2);color:var(--text);font-family:inherit;outline:none}
.form-input:focus,.form-select:focus{border-color:var(--accent)}

/* QTY */
.qty-wrap{display:flex;align-items:center;gap:8px}
.qty-btn{width:42px;height:42px;border-radius:var(--rsm);background:var(--surface);border:0.5px solid var(--border2);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0}
.qty-btn:active{background:var(--surface2)}
.qty-input{text-align:center;flex:1}

/* PHOTOS */
.photos-box{border:1.5px dashed var(--border2);border-radius:var(--r);padding:10px;background:var(--surface2)}
.photos-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.photos-scroll::-webkit-scrollbar{display:none}
.p-wrap{position:relative;flex-shrink:0}
.p-wrap img{width:76px;height:76px;object-fit:cover;border-radius:var(--rsm);display:block}
.p-del{position:absolute;top:-7px;right:-7px;width:21px;height:21px;border-radius:50%;background:var(--text);color:#fff;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700}
.p-add-btns{display:flex;gap:6px;flex-shrink:0}
.p-add-btn{width:76px;height:76px;border:1.5px dashed var(--border2);border-radius:var(--rsm);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);font-size:10px;gap:4px;background:var(--surface);flex-shrink:0}
.p-add-btn .ic{font-size:22px}
.photos-hint{font-size:11px;color:var(--text3);margin-top:6px}

/* DETAIL SLIDER */
.slider-wrap{position:relative;width:100%;height:230px;background:var(--surface2);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.slider-wrap img{width:100%;height:100%;object-fit:cover;display:none}
.slider-wrap img.active{display:block}
.slider-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:56px}
.sl-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.38);color:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sl-prev{left:8px}.sl-next{right:8px}
.sl-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.sl-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.5)}
.sl-dot.on{background:#fff}
.sl-count{position:absolute;top:8px;right:10px;background:rgba(0,0,0,0.42);color:#fff;font-size:11px;padding:2px 8px;border-radius:100px;font-weight:500}
.attr-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:0.5px solid var(--border);font-size:14px}
.attr-key{color:var(--text2)}
.attr-val{font-weight:500;text-align:right;max-width:58%;word-break:break-all}

/* BUTTONS */
.btn-main{width:100%;padding:14px;border-radius:var(--r);background:var(--accent);color:var(--accent-fg);border:none;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit}
.btn-main:active{opacity:.82}
.btn-sub{width:100%;padding:12px;border-radius:var(--r);background:none;color:var(--text);border:0.5px solid var(--border2);font-size:14px;cursor:pointer;margin-top:8px;font-family:inherit}
.btn-danger{color:var(--danger)!important;border-color:var(--danger)!important}

/* EXPORT */
.exp-row{display:flex;align-items:center;gap:10px;padding:14px 12px;background:var(--surface2);border-radius:var(--rsm);margin-bottom:8px;cursor:pointer;border:0.5px solid var(--border);font-size:14px}
.exp-row:active{opacity:.75}
.exp-icon{font-size:22px;flex-shrink:0}

/* CAT/LOC MANAGE */
.edit-tabs{display:flex;border-bottom:0.5px solid var(--border);margin-bottom:16px}
.edit-tab{flex:1;padding:10px;background:none;border:none;border-bottom:2px solid transparent;font-size:14px;cursor:pointer;color:var(--text2);font-family:inherit}
.edit-tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.cat-list-wrap{max-height:38vh;overflow-y:auto;margin-bottom:4px}
.cat-item{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:0.5px solid var(--border)}
.cat-icon-inp{width:46px;font-size:16px;text-align:center;background:var(--surface2);border:0.5px solid var(--border2);border-radius:6px;padding:5px 4px;font-family:inherit;color:var(--text);outline:none}
.cat-name-inp{flex:1;font-size:14px;background:var(--surface2);border:0.5px solid var(--border2);border-radius:6px;padding:5px 8px;font-family:inherit;color:var(--text);outline:none}
.cat-act-btn{background:none;border:none;cursor:pointer;font-size:17px;padding:4px;color:var(--text2)}
.cat-add-row{display:flex;gap:8px;align-items:center;margin-top:14px;padding-top:14px;border-top:0.5px solid var(--border)}
.new-cat-icon{width:52px;font-size:16px;text-align:center;padding:10px 4px;background:var(--surface2);border:0.5px solid var(--border2);border-radius:var(--rsm);font-family:inherit;color:var(--text);outline:none}
.new-cat-name{flex:1;padding:10px 12px;background:var(--surface2);border:0.5px solid var(--border2);border-radius:var(--rsm);font-size:14px;font-family:inherit;color:var(--text);outline:none}
.new-cat-btn{background:var(--accent);color:var(--accent-fg);border:none;border-radius:var(--rsm);padding:10px 14px;font-size:14px;cursor:pointer;white-space:nowrap;font-family:inherit}

/* TOAST */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:rgba(26,26,26,0.9);color:#fff;padding:10px 22px;border-radius:100px;font-size:13px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>MyStuff</h1>
    <p id="topbar-sub">전체 0개 항목</p>
  </div>
  <div style="display:flex;gap:4px">
    <button class="icon-btn" onclick="openExportModal()" aria-label="내보내기">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v13m-4-4 4 4 4-4M3 17v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2"/></svg>
    </button>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tab-bar"></div>
  <button class="tab-edit-btn" onclick="openEditModal()" aria-label="편집" title="카테고리·위치 편집">✎</button>
</div>

<div class="content">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search-input" placeholder="이름, 메모 검색..." oninput="renderItems()" aria-label="검색">
  </div>
  <div id="items-container"><div style="text-align:center;padding:40px;color:var(--text3)">불러오는 중...</div></div>
</div>

<button class="fab" onclick="openAddModal()" aria-label="항목 추가">＋</button>
<div class="toast" id="toast"></div>

<input type="file" id="photo-gallery" accept="image/*" multiple style="display:none" onchange="handleFileInput(event)">
<input type="file" id="photo-camera" accept="image/*" capture="environment" style="display:none" onchange="handleFileInput(event)">

<script>
/* ══ IndexedDB ══ */
var DB_NAME = 'MyStuffDB2', DB_VER = 1, db = null;

function openDB(cb) {
  var req = indexedDB.open(DB_NAME, DB_VER);
  req.onupgradeneeded = function(e) {
    var d = e.target.result;
    if (!d.objectStoreNames.contains('items'))    d.createObjectStore('items',    {keyPath:'id'});
    if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', {keyPath:'key'});
  };
  req.onsuccess = function(e) { db = e.target.result; cb(); };
  req.onerror   = function()  { alert('DB 오류'); };
}
function dbSet(store, val, cb) {
  var tx = db.transaction(store,'readwrite');
  tx.objectStore(store).put(val);
  tx.oncomplete = function(){ if(cb) cb(); };
}
function dbGet(store, key, cb) {
  var tx  = db.transaction(store,'readonly');
  var req = tx.objectStore(store).get(key);
  req.onsuccess = function(){ cb(req.result ? req.result.value : null); };
}
function dbGetAll(store, cb) {
  var tx  = db.transaction(store,'readonly');
  var req = tx.objectStore(store).getAll();
  req.onsuccess = function(){ cb(req.result||[]); };
}
function dbDel(store, key, cb) {
  var tx = db.transaction(store,'readwrite');
  tx.objectStore(store).delete(key);
  tx.oncomplete = function(){ if(cb) cb(); };
}
function dbClear(store, cb) {
  var tx = db.transaction(store,'readwrite');
  tx.objectStore(store).clear();
  tx.oncomplete = function(){ if(cb) cb(); };
}

/* ══ 기본값 ══ */
var DEFAULT_CATS = [
  {id:'books',       name:'Books',       icon:'📚'},
  {id:'electronics', name:'Electronics', icon:'💻'},
  {id:'money',       name:'Money',       icon:'💰'},
  {id:'documents',   name:'Documents',   icon:'📄'},
  {id:'apparels',    name:'Apparels',    icon:'👗'},
  {id:'health',      name:'Health',      icon:'🏥'},
  {id:'stationary',  name:'Stationary',  icon:'✏️'},
  {id:'trip',        name:'Trip',        icon:'✈️'},
  {id:'others',      name:'Others',      icon:'📦'}
];
var DEFAULT_LOCS = ['Home','Other','Home/Other'];

var cats     = JSON.parse(JSON.stringify(DEFAULT_CATS));
var locs     = DEFAULT_LOCS.slice();
var allItems = [];
var activeCat= 'all';
var editingItem = null;
var pendingPhotos = [];
var slideIdx = 0;

/* ══ 유틸 ══ */
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function catMap() { var m={}; cats.forEach(function(c){ m[c.id]=c; }); return m; }
function closeModal(id) { var el=document.getElementById(id); if(el) el.remove(); }

/* ══ 탭 ══ */
function renderTabs() {
  var bar = document.getElementById('tab-bar'); bar.innerHTML='';
  function mk(label,id) {
    var d=document.createElement('div');
    d.className='tab'+(activeCat===id?' active':'');
    d.textContent=label;
    d.onclick=function(){ activeCat=id; renderTabs(); renderItems(); };
    bar.appendChild(d);
  }
  mk('All','all');
  cats.forEach(function(c){ mk(c.icon+' '+c.name, c.id); });
}

/* ══ 목록 ══ */
function filteredItems() {
  var q = document.getElementById('search-input').value.toLowerCase();
  return allItems.filter(function(it) {
    var catOk = activeCat==='all' || it.cat===activeCat;
    var qOk   = !q || it.name.toLowerCase().indexOf(q)>=0 || (it.memo||'').toLowerCase().indexOf(q)>=0;
    return catOk && qOk;
  });
}
function renderItems() {
  var cont = document.getElementById('items-container');
  var list = filteredItems();
  document.getElementById('topbar-sub').textContent = '전체 '+allItems.length+'개 항목';
  if (!list.length) {
    cont.innerHTML = '<div class="empty"><div class="empty-icon">📦</div><p>항목이 없습니다.<br>＋ 버튼으로 추가해보세요.</p></div>';
    return;
  }
  var cm = catMap();
  var ul = document.createElement('div'); ul.className='item-list';
  list.forEach(function(it) {
    var c=cm[it.cat], photos=it.photos||[];
    var card=document.createElement('div'); card.className='item-card';
    card.onclick=function(){ openDetail(it.id); };
    var thumb=document.createElement('div'); thumb.className='item-thumb';
    if (photos.length) {
      var img=document.createElement('img'); img.src=photos[0]; img.alt=it.name; thumb.appendChild(img);
      if (photos.length>1) { var b=document.createElement('div'); b.className='photo-badge'; b.textContent='×'+photos.length; thumb.appendChild(b); }
    } else { thumb.textContent=c?c.icon:'📦'; }
    var info=document.createElement('div'); info.className='item-info';
    info.innerHTML='<div class="item-name">'+esc(it.name)+'</div><div class="item-meta">'+(c?esc(c.name):'')+'</div>';
    if (it.qty||it.location) {
      var chips=document.createElement('div'); chips.className='item-chips';
      if (it.qty)      chips.innerHTML+='<span class="chip">수량 '+esc(it.qty)+'</span>';
      if (it.location) chips.innerHTML+='<span class="chip">'+esc(it.location)+'</span>';
      info.appendChild(chips);
    }
    card.appendChild(thumb); card.appendChild(info); ul.appendChild(card);
  });
  cont.innerHTML=''; cont.appendChild(ul);
}

/* ══ 사진 압축 ══ */
function compressImage(file, cb) {
  var r=new FileReader();
  r.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var MAX=1024, w=img.width, h=img.height;
      if(w>MAX||h>MAX){ if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;} }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.75));
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(file);
}
function handleFileInput(e) {
  var files=Array.from(e.target.files), remaining=10-pendingPhotos.length;
  var toLoad=files.slice(0,remaining);
  if(!toLoad.length){ showToast('최대 10장까지 첨부 가능합니다'); return; }
  var loaded=0;
  toLoad.forEach(function(f){
    compressImage(f,function(url){
      pendingPhotos.push({dataUrl:url});
      if(++loaded===toLoad.length) renderPhotoStrip();
    });
  });
  e.target.value='';
  if(files.length>remaining) showToast('일부 사진이 생략되었습니다');
}
function renderPhotoStrip() {
  var strip=document.getElementById('photos-scroll'); if(!strip) return;
  strip.innerHTML='';
  pendingPhotos.forEach(function(p,i){
    var w=document.createElement('div'); w.className='p-wrap';
    var img=document.createElement('img'); img.src=p.dataUrl; img.alt='사진';
    var del=document.createElement('button'); del.className='p-del'; del.textContent='×';
    del.onclick=(function(idx){ return function(e){ e.stopPropagation(); pendingPhotos.splice(idx,1); renderPhotoStrip(); }; })(i);
    w.appendChild(img); w.appendChild(del); strip.appendChild(w);
  });
  if(pendingPhotos.length<10){
    var btns=document.createElement('div'); btns.className='p-add-btns';
    var camBtn=document.createElement('div'); camBtn.className='p-add-btn';
    camBtn.innerHTML='<span class="ic">📷</span><span>촬영</span>';
    camBtn.onclick=function(){ document.getElementById('photo-camera').click(); };
    var galBtn=document.createElement('div'); galBtn.className='p-add-btn';
    galBtn.innerHTML='<span class="ic">🖼️</span><span>갤러리</span>';
    galBtn.onclick=function(){ document.getElementById('photo-gallery').click(); };
    btns.appendChild(camBtn); btns.appendChild(galBtn); strip.appendChild(btns);
  }
}

/* ══ 추가/수정 모달 ══ */
function openAddModal(prefill) {
  editingItem = prefill||null;
  pendingPhotos = editingItem ? (editingItem.photos||[]).map(function(d){ return {dataUrl:d}; }) : [];

  var catOptions = cats.map(function(c){
    return '<option value="'+c.id+'"'+(editingItem&&editingItem.cat===c.id?' selected':'')+'>'+c.icon+' '+c.name+'</option>';
  }).join('');
  var locOptions = locs.map(function(l){
    return '<option value="'+esc(l)+'">'+esc(l)+'</option>';
  }).join('');

  var wrap=document.createElement('div'); wrap.className='backdrop'; wrap.id='add-modal';
  wrap.onclick=function(e){ if(e.target===wrap) closeModal('add-modal'); };

  wrap.innerHTML='<div class="sheet">'
    +'<div class="sheet-title">'+(editingItem?'항목 수정':'항목 추가')

function handleLocChange(sel) {
  var val = sel.value;
  var actionWrap = document.getElementById('loc-action-wrap');
  var editWrap   = document.getElementById('loc-edit-wrap');
  if (!actionWrap || !editWrap) return;

  if (val === '__add__') {
    /* 새 위치 추가 모드 */
    sel.value = '';
    editWrap.style.display = 'flex';
    editWrap.setAttribute('data-mode', 'add');
    var inp = document.getElementById('loc-edit-inp');
    if (inp) { inp.value = ''; inp.placeholder = '새 위치 이름'; inp.focus(); }
    actionWrap.style.display = 'none';
  } else if (val) {
    /* 기존 위치 선택 — 수정/삭제 버튼 표시 */
    actionWrap.style.display = 'flex';
    editWrap.style.display = 'none';
  } else {
    actionWrap.style.display = 'none';
    editWrap.style.display = 'none';
  }
}

function editLocName() {
  var sel = document.getElementById('f-location');
  var editWrap = document.getElementById('loc-edit-wrap');
  var actionWrap = document.getElementById('loc-action-wrap');
  if (!sel || !editWrap) return;
  editWrap.style.display = 'flex';
  editWrap.setAttribute('data-mode', 'edit');
  var inp = document.getElementById('loc-edit-inp');
  if (inp) { inp.value = sel.value; inp.placeholder = '위치 이름 수정'; inp.focus(); }
  if (actionWrap) actionWrap.style.display = 'none';
}

function confirmLocEdit() {
  var sel  = document.getElementById('f-location');
  var wrap = document.getElementById('loc-edit-wrap');
  var inp  = document.getElementById('loc-edit-inp');
  if (!inp || !sel) return;
  var name = inp.value.trim();
  if (!name) { showToast('이름을 입력해주세요'); return; }
  var mode = wrap ? wrap.getAttribute('data-mode') : 'add';

  if (mode === 'add') {
    if (locs.indexOf(name) >= 0) { showToast('이미 있는 위치입니다'); return; }
    locs.push(name);
    dbSet('settings', {key:'locs', value:locs}, function() {
      /* __add__ 옵션 앞에 삽입 */
      var addOpt = sel.querySelector('option[value="__add__"]');
      var opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      sel.insertBefore(opt, addOpt);
      sel.value = name;
      wrap.style.display = 'none';
      showToast('"' + name + '" 추가 완료 ✓');
    });
  } else {
    /* 수정 모드 */
    var oldName = sel.value;
    var idx = locs.indexOf(oldName);
    if (idx >= 0) locs[idx] = name;
    dbSet('settings', {key:'locs', value:locs}, function() {
      var opt = sel.querySelector('option[value="' + oldName + '"]');
      if (opt) { opt.value = name; opt.textContent = name; }
      sel.value = name;
      wrap.style.display = 'none';
      showToast('"' + name + '"으로 수정 완료 ✓');
    });
  }
}

function cancelLocEdit() {
  var wrap = document.getElementById('loc-edit-wrap');
  if (wrap) wrap.style.display = 'none';
}

function deleteLocItem() {
  var sel = document.getElementById('f-location');
  if (!sel || !sel.value) return;
  var name = sel.value;
  if (!confirm('"' + name + '"을 삭제하시겠습니까?')) return;
  locs = locs.filter(function(l){ return l !== name; });
  dbSet('settings', {key:'locs', value:locs}, function() {
    var opt = sel.querySelector('option[value="' + name + '"]');
    if (opt) opt.remove();
    sel.value = '';
    document.getElementById('loc-action-wrap').style.display = 'none';
    showToast('"' + name + '" 삭제 완료 ✓');
  });
}

function changeQty(dir) {
  var inp=document.getElementById('f-qty'); if(!inp) return;
  var v=parseInt(inp.value)||0; v+=dir; if(v<0) v=0; inp.value=v;
}

function saveItem() {
  var name=document.getElementById('f-name').value.trim();
  if(!name){ alert('이름을 입력해주세요'); return; }
  var item={
    id:       editingItem?editingItem.id:Date.now().toString(),
    cat:      document.getElementById('f-cat').value,
    name:     name,
    location: document.getElementById('f-location').value,
    qty:      document.getElementById('f-qty').value,
    date:     document.getElementById('f-date').value,
    memo:     document.getElementById('f-memo').value.trim(),
    photos:   pendingPhotos.map(function(p){ return p.dataUrl; }),
    created:  editingItem?editingItem.created:new Date().toLocaleDateString('ko-KR')
  };
  dbSet('items', item, function(){
    dbGetAll('items', function(result){
      allItems=result.sort(function(a,b){ return b.id-a.id; });
      closeModal('add-modal'); renderItems();
      showToast(editingItem?'수정되었습니다':'추가되었습니다 ✓');
    });
  });
}

function deleteItem(id) {
  if(!confirm('삭제하시겠습니까?')) return;
  dbDel('items', id, function(){
    allItems=allItems.filter(function(i){ return i.id!==id; });
    closeModal('add-modal'); closeModal('detail-modal'); renderItems();
    showToast('삭제되었습니다');
  });
}

/* ══ 상세보기 ══ */
function openDetail(id) {
  var it=allItems.find(function(i){ return i.id===id; }); if(!it) return;
  var c=catMap()[it.cat], photos=it.photos||[];
  slideIdx=0;
  var sliderHtml='';
  if(photos.length){
    var imgs=photos.map(function(p,i){ return '<img src="'+p+'" alt="사진'+(i+1)+'" class="'+(i===0?'active':'')+'">'; }).join('');
    var nav=photos.length>1
      ?'<button class="sl-btn sl-prev" onclick="slide(-1)">‹</button>'
       +'<button class="sl-btn sl-next" onclick="slide(1)">›</button>'
       +'<div class="sl-dots" id="d-dots">'+photos.map(function(_,i){ return '<div class="sl-dot'+(i===0?' on':'')+'"></div>'; }).join('')+'</div>'
       +'<div class="sl-count" id="d-count">1 / '+photos.length+'</div>'
      :'';
    sliderHtml='<div class="slider-wrap" id="d-slider">'+imgs+nav+'</div>';
  } else {
    sliderHtml='<div class="slider-wrap"><div class="slider-empty">'+(c?c.icon:'📦')+'</div></div>';
  }
  var attrs=[
    ['카테고리', c?c.icon+' '+c.name:''],
    ['위치',     it.location],
    ['수량',     it.qty],
    ['날짜',     it.date],
    ['메모',     it.memo],
    ['사진',     photos.length?photos.length+'장':''],
    ['등록일',   it.created]
  ].filter(function(r){ return r[1]; }).map(function(r){
    return '<div class="attr-row"><span class="attr-key">'+r[0]+'</span><span class="attr-val">'+esc(String(r[1]))+'</span></div>';
  }).join('');

  var itemId=it.id;
  var wrap=document.createElement('div'); wrap.className='backdrop'; wrap.id='detail-modal';
  wrap.onclick=function(e){ if(e.target===wrap) closeModal('detail-modal'); };
  wrap.innerHTML='<div class="sheet">'
    +'<div class="sheet-title">'+esc(it.name)
    +'<button class="icon-btn" onclick="closeModal(\'detail-modal\')" style="font-size:22px">✕</button></div>'
    +sliderHtml+attrs
    +'<button class="btn-main" onclick="closeModal(\'detail-modal\');openAddModal(allItems.find(function(i){return i.id===\''+itemId+'\';}))">✎ 수정</button>'
    +'<button class="btn-sub" onclick="copyItem(\''+itemId+'\')">⧉ 복사</button>'
    +'<button class="btn-sub btn-danger" onclick="deleteItem(\''+itemId+'\')">🗑 삭제</button>'
    +'</div>';
  document.body.appendChild(wrap);

  window.slide=function(dir){
    var imgEls=document.querySelectorAll('#d-slider img');
    var dotEls=document.querySelectorAll('#d-dots .sl-dot');
    var cnt=document.getElementById('d-count');
    if(!imgEls.length) return;
    imgEls[slideIdx].classList.remove('active');
    if(dotEls[slideIdx]) dotEls[slideIdx].classList.remove('on');
    slideIdx=(slideIdx+dir+imgEls.length)%imgEls.length;
    imgEls[slideIdx].classList.add('active');
    if(dotEls[slideIdx]) dotEls[slideIdx].classList.add('on');
    if(cnt) cnt.textContent=(slideIdx+1)+' / '+imgEls.length;
  };
}

function copyItem(id) {
  var it=allItems.find(function(i){ return i.id===id; }); if(!it) return;
  var copied=JSON.parse(JSON.stringify(it));
  copied.id=Date.now().toString();
  copied.name=it.name+' (복사)';
  copied.created=new Date().toLocaleDateString('ko-KR');
  copied.date=new Date().toISOString().slice(0,10);
  dbSet('items', copied, function(){
    dbGetAll('items', function(result){
      allItems=result.sort(function(a,b){ return b.id-a.id; });
      closeModal('detail-modal'); renderItems();
      showToast('"'+copied.name+'" 복사 완료 ✓');
    });
  });
}

/* ══ 카테고리·위치 통합 편집 ══ */
function openEditModal() {
  var editCats=JSON.parse(JSON.stringify(cats));
  var editLocs=locs.slice();

  var wrap=document.createElement('div'); wrap.className='backdrop'; wrap.id='edit-modal';
  wrap.onclick=function(e){ if(e.target===wrap) closeModal('edit-modal'); };
  wrap.innerHTML='<div class="sheet">'
    +'<div class="sheet-title">카테고리 · 위치 편집'
    +'<button class="icon-btn" onclick="closeModal(\'edit-modal\')" style="font-size:22px">✕</button></div>'
    +'<div class="edit-tabs">'
    +'<button class="edit-tab active" id="etab-cat" onclick="switchETab(\'cat\')">📂 카테고리</button>'
    +'<button class="edit-tab" id="etab-loc" onclick="switchETab(\'loc\')">📍 위치</button>'
    +'</div>'
    +'<div id="epanel-cat">'
    +'<div class="cat-list-wrap" id="ecat-list"></div>'
    +'<div class="cat-add-row">'
    +'<input class="new-cat-icon" id="ecat-icon" type="text" placeholder="🏷️" maxlength="2">'
    +'<input class="new-cat-name" id="ecat-name" type="text" placeholder="카테고리 이름">'
    +'<button class="new-cat-btn" onclick="eCatAdd()">＋</button>'
    +'</div>'
    +'<button class="btn-main" style="margin-top:12px" onclick="eCatSave()">✓ 카테고리 저장</button>'
    +'</div>'
    +'<div id="epanel-loc" style="display:none">'
    +'<div class="cat-list-wrap" id="eloc-list"></div>'
    +'<div class="cat-add-row">'
    +'<input class="new-cat-name" id="eloc-name" type="text" placeholder="위치 이름 (예: Office, 창고...)">'
    +'<button class="new-cat-btn" onclick="eLocAdd()">＋</button>'
    +'</div>'
    +'<button class="btn-main" style="margin-top:12px" onclick="eLocSave()">✓ 위치 저장</button>'
    +'</div>'
    +'</div>';
  document.body.appendChild(wrap);

  /* 탭 전환 */
  window.switchETab=function(tab){
    var catTab=document.getElementById('etab-cat'), locTab=document.getElementById('etab-loc');
    var catPanel=document.getElementById('epanel-cat'), locPanel=document.getElementById('epanel-loc');
    if(tab==='cat'){
      catTab.className='edit-tab active'; locTab.className='edit-tab';
      catPanel.style.display=''; locPanel.style.display='none';
    } else {
      locTab.className='edit-tab active'; catTab.className='edit-tab';
      locPanel.style.display=''; catPanel.style.display='none';
      renderELoc();
    }
  };

  /* 카테고리 렌더 */
  function renderECat() {
    var lw=document.getElementById('ecat-list'); if(!lw) return;
    lw.innerHTML='';
    editCats.forEach(function(c,i){
      var row=document.createElement('div'); row.className='cat-item';
      var upDis=i===0?' disabled style="opacity:.3"':'';
      var dnDis=i===editCats.length-1?' disabled style="opacity:.3"':'';
      row.innerHTML='<input class="cat-icon-inp" type="text" value="'+esc(c.icon)+'" maxlength="2">'
        +'<input class="cat-name-inp" type="text" value="'+esc(c.name)+'">'
        +'<button class="cat-act-btn"'+upDis+' onclick="eCatMove('+i+',-1)">▲</button>'
        +'<button class="cat-act-btn"'+dnDis+' onclick="eCatMove('+i+',1)">▼</button>'
        +'<button class="cat-act-btn" onclick="eCatDel('+i+')" style="color:var(--danger)">🗑</button>';
      lw.appendChild(row);
    });
  }
  function collectECat(){
    var icons=document.querySelectorAll('#ecat-list .cat-icon-inp');
    var names=document.querySelectorAll('#ecat-list .cat-name-inp');
    icons.forEach(function(el,i){ if(editCats[i]) editCats[i].icon=el.value.trim()||editCats[i].icon; });
    names.forEach(function(el,i){ if(editCats[i]) editCats[i].name=el.value.trim()||editCats[i].name; });
  }
  window.eCatAdd=function(){
    var icon=document.getElementById('ecat-icon').value.trim()||'📁';
    var name=document.getElementById('ecat-name').value.trim();
    if(!name){ alert('이름을 입력해주세요'); return; }
    collectECat();
    editCats.push({id:'cat_'+Date.now(),name:name,icon:icon});
    document.getElementById('ecat-icon').value='';
    document.getElementById('ecat-name').value='';
    renderECat(); showToast('추가됨 — 저장 버튼으로 확정');
  };
  window.eCatMove=function(i,dir){
    collectECat(); var j=i+dir;
    if(j<0||j>=editCats.length) return;
    var tmp=editCats[i]; editCats[i]=editCats[j]; editCats[j]=tmp; renderECat();
  };
  window.eCatDel=function(i){
    if(allItems.some(function(it){ return it.cat===editCats[i].id; })){ alert('"'+editCats[i].name+'" 카테고리에 항목이 있어 삭제할 수 없습니다.'); return; }
    if(!confirm('"'+editCats[i].name+'"을 삭제하시겠습니까?')) return;
    collectECat(); editCats.splice(i,1); renderECat();
  };
  window.eCatSave=function(){
    collectECat();
    if(!editCats.length){ alert('카테고리가 최소 1개 있어야 합니다'); return; }
    cats=editCats;
    if(!cats.find(function(c){ return c.id===activeCat; })) activeCat='all';
    dbSet('settings',{key:'cats',value:cats},function(){
      closeModal('edit-modal'); renderTabs(); renderItems();
      showToast('카테고리 저장 완료 ✓');
    });
  };

  /* 위치 렌더 */
  function renderELoc() {
    var lw=document.getElementById('eloc-list'); if(!lw) return;
    lw.innerHTML='';
    editLocs.forEach(function(loc,i){
      var row=document.createElement('div'); row.className='cat-item';
      var upDis=i===0?' disabled style="opacity:.3"':'';
      var dnDis=i===editLocs.length-1?' disabled style="opacity:.3"':'';
      row.innerHTML='<input class="cat-name-inp" type="text" value="'+esc(loc)+'" style="flex:1">'
        +'<button class="cat-act-btn"'+upDis+' onclick="eLocMove('+i+',-1)">▲</button>'
        +'<button class="cat-act-btn"'+dnDis+' onclick="eLocMove('+i+',1)">▼</button>'
        +'<button class="cat-act-btn" onclick="eLocDel('+i+')" style="color:var(--danger)">🗑</button>';
      lw.appendChild(row);
    });
  }
  function collectELoc(){
    document.querySelectorAll('#eloc-list .cat-name-inp').forEach(function(el,i){ if(editLocs[i]!==undefined) editLocs[i]=el.value.trim()||editLocs[i]; });
  }
  window.eLocAdd=function(){
    var name=document.getElementById('eloc-name').value.trim();
    if(!name){ alert('이름을 입력해주세요'); return; }
    collectELoc(); editLocs.push(name);
    document.getElementById('eloc-name').value='';
    renderELoc(); showToast('추가됨 — 저장 버튼으로 확정');
  };
  window.eLocMove=function(i,dir){
    collectELoc(); var j=i+dir;
    if(j<0||j>=editLocs.length) return;
    var tmp=editLocs[i]; editLocs[i]=editLocs[j]; editLocs[j]=tmp; renderELoc();
  };
  window.eLocDel=function(i){
    if(!confirm('"'+editLocs[i]+'"을 삭제하시겠습니까?')) return;
    collectELoc(); editLocs.splice(i,1); renderELoc();
  };
  window.eLocSave=function(){
    collectELoc();
    if(!editLocs.length){ alert('위치가 최소 1개 있어야 합니다'); return; }
    locs=editLocs;
    dbSet('settings',{key:'locs',value:locs},function(){
      closeModal('edit-modal');
      showToast('위치 저장 완료 ✓');
    });
  };

  renderECat();
}

    +'<div><div style="font-weight:500">CSV 내보내기</div><div style="font-size:12px;color:var(--text2)">엑셀에서 바로 열 수 있습니다</div></div></div>'
    +'<div class="exp-row" onclick="exportJSON()"><span class="exp-icon">💾</span>'
    +'<div><div style="font-weight:500">JSON 백업 저장</div><div style="font-size:12px;color:var(--text2)">사진 포함 전체 백업</div></div></div>'
    +'<div class="exp-row" onclick="document.getElementById(\'import-file\').click()"><span class="exp-icon">📂</span>'
    +'<div><div style="font-weight:500">JSON 백업에서 복원</div><div style="font-size:12px;color:var(--text2)">기존 데이터를 불러옵니다</div></div></div>'
    +'<input type="file" id="import-file" accept=".json" style="display:none" onchange="importJSON(event)">'
    +'</div>';
  document.body.appendChild(wrap);
}

function downloadAppFile() {
  var a=document.createElement('a');
  a.href=window.location.href; a.download='MyStuff.html'; a.click();
  showToast('앱 파일 다운로드 시작 ✓');
}
function exportCSV() {
  var cm=catMap();
  var hdr=['이름','카테고리','위치','수량','날짜','메모','사진수','등록일'];
  var rows=allItems.map(function(it){
    return [it.name,cm[it.cat]?cm[it.cat].name:it.cat,it.location,it.qty,it.date,it.memo,(it.photos||[]).length,it.created]
      .map(function(v){ return '"'+String(v||'').replace(/"/g,'""')+'"'; });
  });
  dl('\uFEFF'+[hdr].concat(rows).map(function(r){ return r.join(','); }).join('\n'),'MyStuff_내보내기.csv','text/csv;charset=utf-8');
  showToast('CSV 저장 완료 ✓');
}
function exportJSON() {
  dl(JSON.stringify({cats:cats,locs:locs,items:allItems},null,2),'MyStuff_백업.json','application/json');
  showToast('백업 완료 ✓');
}
function importJSON(e) {
  var f=e.target.files[0]; if(!f) return;
  if(!confirm('현재 데이터가 교체됩니다. 계속하시겠습니까?')) return;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      var newItems=d.items||[], newCats=d.cats||cats, newLocs=d.locs||locs;
      dbClear('items',function(){
        var count=0;
        if(!newItems.length){
          allItems=[]; cats=newCats; locs=newLocs;
          dbSet('settings',{key:'cats',value:cats},function(){
            dbSet('settings',{key:'locs',value:locs},function(){
              closeModal('export-modal'); renderTabs(); renderItems();
              showToast('복원 완료');
            });
          });
          return;
        }
        newItems.forEach(function(item){
          dbSet('items',item,function(){
            if(++count===newItems.length){
              dbGetAll('items',function(result){
                allItems=result.sort(function(a,b){ return b.id-a.id; });
                cats=newCats; locs=newLocs;
                dbSet('settings',{key:'cats',value:cats},function(){
                  dbSet('settings',{key:'locs',value:locs},function(){
                    closeModal('export-modal'); renderTabs(); renderItems();
                    showToast('복원 완료 — '+allItems.length+'개 항목');
                  });
                });
              });
            }
          });
        });
      });
    }catch(err){ alert('파일 형식이 올바르지 않습니다.'); }
  };
  r.readAsText(f);
}
function dl(content,filename,type){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:type}));
  a.download=filename; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
}

/* ══ PWA ══ */
(function(){
  var cv=document.createElement('canvas'); cv.width=192; cv.height=192;
  var ctx=cv.getContext('2d');
  ctx.fillStyle='#1a1a1a';
  if(ctx.roundRect) ctx.roundRect(0,0,192,192,36); else ctx.rect(0,0,192,192);
  ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 80px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('M',96,96);
  var iconUrl=cv.toDataURL('image/png');
  var pi=document.getElementById('pwa-icon'); if(pi) pi.href=iconUrl;
  try{
    var m={name:'MyStuff',short_name:'MyStuff',start_url:window.location.href,display:'standalone',background_color:'#f5f5f7',theme_color:'#1a1a1a',icons:[{src:iconUrl,sizes:'192x192',type:'image/png'}]};
    var mb=new Blob([JSON.stringify(m)],{type:'application/json'});
    var mel=document.getElementById('pwa-manifest'); if(mel) mel.href=URL.createObjectURL(mb);
  }catch(e){}
  if('serviceWorker' in navigator){
    var sw=['self.addEventListener("install",function(e){self.skipWaiting();});','self.addEventListener("activate",function(e){self.clients.claim();});'];
    try{ navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw.join('\n')],{type:'application/javascript'}))).catch(function(){}); }catch(e){}
  }
  var def=null;
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); def=e;
    if(document.getElementById('install-banner')) return;
    var b=document.createElement('div'); b.id='install-banner';
    b.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 18px;border-radius:100px;font-size:13px;z-index:9999;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,0.3);white-space:nowrap;';
    var ab=document.createElement('button'); ab.textContent='📲 홈 화면에 추가';
    ab.style.cssText='background:#fff;color:#1a1a1a;border:none;border-radius:100px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;';
    ab.onclick=function(){ if(!def) return; def.prompt(); def.userChoice.then(function(){ def=null; b.remove(); }); };
    var cb=document.createElement('button'); cb.textContent='✕';
    cb.style.cssText='background:none;border:none;color:rgba(255,255,255,0.7);font-size:18px;cursor:pointer;padding:0;';
    cb.onclick=function(){ b.remove(); };
    b.appendChild(ab); b.appendChild(cb); document.body.appendChild(b);
  });
})();

/* ══ 앱 시작 ══ */
openDB(function(){
  dbGet('settings','cats',function(savedCats){
    if(savedCats) cats=savedCats;
    dbGet('settings','locs',function(savedLocs){
      if(savedLocs) locs=savedLocs;
      dbGetAll('items',function(result){
        allItems=result.sort(function(a,b){ return b.id-a.id; });
        renderTabs(); renderItems();
      });
    });
  });
});
</script>
