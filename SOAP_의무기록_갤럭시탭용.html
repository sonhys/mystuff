<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fb">
<title>SOAP 의무기록 작성 보조</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f7fb;color:#1f2937}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:980px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 26px rgba(0,0,0,.08)}
h1{font-size:25px;margin:0 0 6px}
.desc{font-size:15px;color:#6b7280;margin-bottom:16px}
label{display:block;font-weight:700;margin:12px 0 7px}
input,textarea{width:100%;border:1px solid #cfd5dd;border-radius:12px;padding:14px;font-size:16px;background:#fff}
input{height:50px}
textarea{min-height:260px;line-height:1.65;resize:vertical}
.actions{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin:14px 0}
button{min-height:50px;border:0;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:#fff}
.copy{background:#2563eb;color:#fff}
.light{background:#e8edf3;color:#111827}
#result{min-height:300px;white-space:pre-wrap;line-height:1.7;border:1px solid #cfd5dd;border-radius:12px;padding:16px;background:#fbfcfe;font-size:16px}
.status{min-height:22px;color:#047857;font-size:14px;margin-top:8px}
.small{font-size:13px;color:#6b7280;margin-top:7px}
@media(max-width:680px){
  .wrap{padding:10px}
  .card{padding:15px;border-radius:14px}
  h1{font-size:22px}
  textarea{min-height:230px}
  .actions{grid-template-columns:1fr 1fr}
  .primary{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>SOAP 의무기록 작성 보조</h1>
<div class="desc">임상정보를 자유롭게 입력한 뒤 SOAP 생성을 누르세요.</div>

<label for="apiKey">OpenAI API Key</label>
<input id="apiKey" type="password" placeholder="sk-..." autocomplete="off">
<div class="small">이 기기에만 저장됩니다.</div>

<label for="note">임상정보</label>
<textarea id="note" placeholder="예: 3일 전부터 상복부 불쾌감. 구역(+), 구토(-). 고혈압(+). 어머니 당뇨병, 아버지 고혈압. 3년 전 충수절제술. BC, CBC, 내시경 권유했으나 검사 거부. 약만 원함. 약 처방 3일, 경과 관찰."></textarea>

<div class="actions">
<button class="primary" id="generateBtn" onclick="generateSOAP()">SOAP 생성</button>
<button class="copy" onclick="copyResult()">전체 복사</button>
<button class="light" onclick="clearAll()">초기화</button>
</div>

<div class="status" id="status"></div>

<label>SOAP 결과</label>
<div id="result"></div>
</div>
</div>

<script>
const SYSTEM_PROMPT = `
당신은 한국어 외래 의무기록 작성 보조자이다.
사용자가 두서없이 입력한 임상 메모를 임상 문맥에 맞게 재구성한다.

규칙:
1. 출력은 [S], [O], [A], [P] 순서로 작성한다.
2. S에는 CC, 현병력, 관련 양성·음성 증상, PMH, PSH, FH, 환자의 요구를 정돈한다.
3. O에는 실제로 확인된 활력징후, 진찰, 검사결과만 넣는다.
4. 검사를 권유했으나 거부한 경우 O에 넣지 말고 P에 기록한다.
5. A에는 합리적인 임상적 인상과 감별진단을 제시한다.
6. 확진 근거가 부족하면 r/o, 의심, 감별 필요, 확진 불가로 표현한다.
7. 입력하지 않은 검사결과, 활력징후, 약 이름, 용량은 만들지 않는다.
8. 음성 병력은 질환 없음으로 정확히 표현한다.
9. 가족력은 환자 본인의 질환으로 분류하지 않는다.
10. 계획에는 실제 입력된 처방, 검사 권유·거부, 교육, 추적관찰을 반영한다.
11. EMR에 바로 붙여넣기 좋게 간결하고 자연스럽게 작성한다.
12. 설명이나 머리말 없이 SOAP 기록만 출력한다.
`;

window.addEventListener('load', () => {
  const saved = localStorage.getItem('soap_openai_key');
  if(saved) document.getElementById('apiKey').value = saved;
});

async function generateSOAP(){
  const apiKey = document.getElementById('apiKey').value.trim();
  const note = document.getElementById('note').value.trim();
  const result = document.getElementById('result');
  const status = document.getElementById('status');
  const btn = document.getElementById('generateBtn');

  if(!apiKey){ alert('OpenAI API Key를 입력하세요.'); return; }
  if(!note){ alert('임상정보를 입력하세요.'); return; }

  localStorage.setItem('soap_openai_key', apiKey);
  btn.disabled = true;
  btn.textContent = '작성 중...';
  status.textContent = '';
  result.textContent = '';

  try{
    const response = await fetch('https://api.openai.com/v1/responses', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer ' + apiKey
      },
      body:JSON.stringify({
        model:'gpt-5-mini',
        instructions:SYSTEM_PROMPT,
        input:note
      })
    });

    const data = await response.json();
    if(!response.ok){
      throw new Error(data?.error?.message || 'SOAP 생성에 실패했습니다.');
    }

    let text = data.output_text || '';
    if(!text && Array.isArray(data.output)){
      text = data.output
        .flatMap(x => x.content || [])
        .filter(x => x.type === 'output_text')
        .map(x => x.text || '')
        .join('\n');
    }

    result.textContent = text.trim();
    status.textContent = 'SOAP 생성 완료';
  }catch(err){
    result.textContent = '오류: ' + err.message;
  }finally{
    btn.disabled = false;
    btn.textContent = 'SOAP 생성';
  }
}

async function copyResult(){
  const text = document.getElementById('result').textContent.trim();
  if(!text){ alert('먼저 SOAP를 생성하세요.'); return; }
  try{
    await navigator.clipboard.writeText(text);
  }catch{
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  document.getElementById('status').textContent = '복사 완료';
}

function clearAll(){
  document.getElementById('note').value = '';
  document.getElementById('result').textContent = '';
  document.getElementById('status').textContent = '';
}
</script>
</body>
</html>
